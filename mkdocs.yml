site_name: PIVMA — Plataforma Integrada de Validação de Métodos Alternativos
site_description: Documentação técnica, arquitetura de domínio e guias de integração do PIVMA (BraCVAM/Fiocruz).
site_author: Equipe BraCVAM / Fiocruz
repo_name: pivma-bracvam/pivma-back
repo_url: https://github.com/pivma-bracvam/pivma-back

theme:
  name: material
  language: pt-BR
  palette:
    # Modo Claro
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    # Modo Escuro
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Onboarding & Ambiente:
      - Inicialização Local: onboarding/local-setup.md
      - Arquitetura de Seeds & Reset: onboarding/seed-architecture.md
  - Domínio & Governança:
      - Ciclo de Vida do Processo: domain/process-lifecycle.md
      - Matriz de RBAC & Cargos: domain/rbac.md
  - Funcionalidades & Endpoints:
      - Painel de Pendências (Kanban): features/kanban.md
      - Triagem Técnica & IA Assistiva: features/triage-and-ai.md
      - Formulários Dinâmicos: features/dynamic-forms.md
  - Guia de Integração (Frontend):
      - Autenticação e Sessão: frontend-recipes/auth-session.md
