<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIVMA - Índice Operacional da Plataforma (Tempo Real)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <a href="../index.html" class="text-slate-400 hover:text-white transition">&larr; Catálogo</a>
      <h1 class="text-xl font-bold text-teal-400">PIVMA :: Índice Operacional de Eventos</h1>
      <span class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded">Tempo Real (SSE)</span>
    </div>
    <div class="flex items-center space-x-3">
      <div id="connectionStatus" class="flex items-center space-x-2 text-sm text-yellow-400">
        <span class="w-3 h-3 rounded-full bg-yellow-400 animate-pulse"></span>
        <span>Desconectado</span>
      </div>
    </div>
  </header>

  <main class="flex-1 p-6 max-w-7xl mx-auto w-full flex flex-col space-y-4">
    <!-- Painel de Conexão e Filtros -->
    <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 flex flex-wrap gap-4 items-center justify-between">
      <div class="flex items-center space-x-2 flex-1 min-w-[300px]">
        <label for="adminToken" class="text-sm font-medium text-slate-300">Token Admin:</label>
        <input type="password" id="adminToken" placeholder="Cole o JWT de Administrador..." 
               class="bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-sm text-white flex-1 focus:outline-none focus:border-teal-400">
        <button id="btnConnect" class="bg-teal-500 hover:bg-teal-600 text-slate-950 font-semibold px-4 py-1.5 rounded text-sm transition">
          Conectar Stream
        </button>
      </div>

      <div class="flex items-center space-x-3 text-sm">
        <select id="filterStatus" class="bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-slate-200">
          <option value="">Todos os Status</option>
          <option value="SUCCESS">SUCCESS</option>
          <option value="FAILED">FAILED</option>
        </select>
        <button id="btnClear" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-slate-200 transition">
          Limpar Tela
        </button>
      </div>
    </div>

    <!-- Tabela de Eventos em Tempo Real -->
    <div class="flex-1 bg-slate-800 rounded-lg border border-slate-700 overflow-hidden flex flex-col">
      <div class="p-3 bg-slate-850 border-b border-slate-700 flex justify-between items-center text-xs text-slate-400">
        <span>Eventos recebidos: <strong id="eventCount" class="text-white">0</strong></span>
        <span>Destino: <code class="text-teal-300">logs/application/events.jsonl</code></span>
      </div>
      <div class="flex-1 overflow-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-950 text-slate-400 text-xs uppercase border-b border-slate-700 sticky top-0">
            <tr>
              <th class="p-3">Data/Hora</th>
              <th class="p-3">Operação</th>
              <th class="p-3">Status</th>
              <th class="p-3">Duração Total</th>
              <th class="p-3">Correlation ID</th>
              <th class="p-3">Ações</th>
            </tr>
          </thead>
          <tbody id="eventsTableBody" class="divide-y divide-slate-700">
            <tr id="emptyRow" class="text-center text-slate-500 py-8">
              <td colspan="6" class="p-6">Nenhum evento registrado ainda. Conecte o stream ou dispare operações.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
