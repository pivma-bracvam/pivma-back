<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIVMA - Editor de Templates de Formulários</title>
  <link rel="stylesheet" href="/demos/assets/base.css">
  <style>
    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
    }

    .back-link {
      font-size: 14px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .session-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 8px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-size: 13px;
    }

    .session-badge {
      font-weight: 600;
      color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #1e293b;
    }

    .btn {
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: background-color 0.15s, opacity 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-success:hover {
      background: #166534;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-danger:hover {
      background: #991b1b;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: #334155;
    }

    .btn-outline:hover {
      background: #f1f5f9;
    }

    .btn-sm {
      font-size: 12px;
      padding: 4px 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    input,
    select,
    textarea {
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      outline: none;
      font-family: inherit;
      width: 100%;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
    }

    .field-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 12px;
      background: #ffffff;
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #f1f5f9;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 768px) {

      .grid-2,
      .grid-3 {
        grid-template-columns: 1fr;
      }
    }

    .inspector {
      background: #0f172a;
      color: #38bdf8;
      padding: 14px;
      border-radius: var(--radius);
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
      overflow-x: auto;
      max-height: 240px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div>
        <a href="/demos/" class="back-link">&larr; Voltar ao Hub de Demonstrações</a>
        <h1>PIVMA - Editor de Templates de Formulários</h1>
        <p class="subtitle">Customização de formulários de processos padrão para administradores BraCVAM</p>
      </div>

      <div class="session-bar">
        <span>Sessão:</span>
        <span id="user-display" class="session-badge">Não autenticado</span>
        <button id="btn-login" class="btn btn-sm btn-primary" onclick="quickLoginAdmin()">Entrar como Administrador
          (BraCVAM)</button>
        <button id="btn-logout" class="btn btn-sm btn-outline" style="display:none;" onclick="logout()">Sair</button>
      </div>
    </header>

    <!-- Seleção de Template -->
    <div class="card">
      <h2>Seleção de Processo e Formulário</h2>
      <div class="grid-3" style="align-items: flex-end;">
        <div class="form-group" style="margin-bottom: 0;">
          <label>Processo:</label>
          <select id="select-process" onchange="onProcessChange()">
            <option value="pre_validated_method">Método Pré-Validado (pre_validated_method)</option>
            <option value="scope_extension">Extensão de Escopo (scope_extension)</option>
            <option value="me_too_validation">Validação Me-Too (me_too_validation)</option>
            <option value="validated_method_dossier">Dossiê de Método Validado (validated_method_dossier)</option>
            <option value="proof_of_concept">Prova de Conceito (proof_of_concept)</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label>Formulário Vinculado:</label>
          <select id="select-form" onchange="loadTemplate()">
            <option value="submission_pre_validated_v1">submission_pre_validated_v1</option>
          </select>
        </div>

        <div>
          <button class="btn btn-outline" style="width: 100%;" onclick="loadTemplate()">Recarregar Template</button>
        </div>
      </div>
    </div>

    <!-- Área de Edição do Template -->
    <div id="editor-container" class="card" style="display: none;">
      <div
        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px;">
        <h2>Campos do Formulário</h2>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-outline btn-sm" onclick="addNewField()">Adicionar Campo</button>
          <button class="btn btn-success" onclick="saveTemplate()">Salvar Template (PUT)</button>
        </div>
      </div>

      <div class="grid-2" style="margin-bottom: 14px;">
        <div class="form-group">
          <label>Nome do Formulário:</label>
          <input type="text" id="form-name">
        </div>
        <div class="form-group">
          <label>Descrição:</label>
          <input type="text" id="form-desc">
        </div>
      </div>

      <div id="fields-list">
        <!-- Renderizado dinamicamente -->
      </div>

      <div
        style="margin-top: 16px; display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border);">
        <button class="btn btn-outline" onclick="addNewField()">Adicionar Campo</button>
        <button class="btn btn-success" onclick="saveTemplate()">Salvar Template (PUT)</button>
      </div>
    </div>

    <!-- Inspetor da API -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <h2>Inspetor da API</h2>
        <span id="inspector-status" style="font-size: 12px; font-weight: 600; color: var(--primary);">Pronto</span>
      </div>
      <div id="inspector-info" style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">Nenhuma requisição
        efetuada.</div>
      <pre id="api-inspector" class="inspector">{}</pre>
    </div>
  </div>

  <script>
    let templateData = null;

    const PROCESS_FORM_MAP = {
      'pre_validated_method': 'submission_pre_validated_v1',
      'scope_extension': 'submission_scope_extension_v1',
      'me_too_validation': 'submission_me_too_v1',
      'validated_method_dossier': 'submission_validated_dossier_v1',
      'proof_of_concept': 'submission_proof_of_concept_v1'
    };

    function inspect(method, url, status, data) {
      document.getElementById('inspector-info').textContent = `${method} ${url} -> HTTP ${status}`;
      const stEl = document.getElementById('inspector-status');
      stEl.textContent = `Status: ${status}`;
      stEl.style.color = status >= 200 && status < 300 ? 'var(--success)' : 'var(--danger)';
      document.getElementById('api-inspector').textContent = JSON.stringify(data, null, 2);
    }

    async function apiRequest(endpoint, options = {}) {
      options.credentials = 'include';
      options.headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };
      const res = await fetch(endpoint, options);
      const data = await res.json().catch(() => null);
      inspect(options.method || 'GET', endpoint, res.status, data);
      return { status: res.status, ok: res.ok, data };
    }

    async function checkSession() {
      try {
        const res = await fetch('/auth/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          const user = data.user;
          document.getElementById('user-display').textContent = `${user.full_name || user.username} (${user.username})`;
          document.getElementById('btn-login').style.display = 'none';
          document.getElementById('btn-logout').style.display = 'inline-block';
        } else {
          document.getElementById('user-display').textContent = 'Não autenticado';
          document.getElementById('btn-login').style.display = 'inline-block';
          document.getElementById('btn-logout').style.display = 'none';
        }
      } catch (err) { }
    }

    async function quickLoginAdmin() {
      const res = await apiRequest('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ identifier: 'admin', password: 'Password123!' })
      });
      if (res.ok) {
        await checkSession();
        await loadTemplate();
      } else {
        alert('Falha na autenticação: ' + (res.data?.detail || 'Erro ao conectar.'));
      }
    }

    async function logout() {
      await apiRequest('/auth/logout', { method: 'POST' });
      await checkSession();
    }

    function onProcessChange() {
      const pKey = document.getElementById('select-process').value;
      const fKey = PROCESS_FORM_MAP[pKey] || 'submission_pre_validated_v1';
      document.getElementById('select-form').innerHTML = `<option value="${fKey}">${fKey}</option>`;
      loadTemplate();
    }

    async function loadTemplate() {
      const pKey = document.getElementById('select-process').value;
      const fKey = document.getElementById('select-form').value;

      const url = `/processes/templates/${pKey}/forms/${fKey}`;
      const res = await apiRequest(url);

      if (!res.ok) {
        document.getElementById('editor-container').style.display = 'none';
        alert(`Erro ao carregar template (${res.status}): ${res.data?.detail || 'Não encontrado ou sem permissão.'}`);
        return;
      }

      templateData = res.data;
      document.getElementById('form-name').value = templateData.name || '';
      document.getElementById('form-desc').value = templateData.description || '';
      document.getElementById('editor-container').style.display = 'block';
      renderFields();
      loadAssignmentBadges();
    }

    async function loadAssignmentBadges() {
      const fKey = document.getElementById('select-form').value;
      const res = await fetch(`/form-templates/${fKey}/evaluable-fields`, { credentials: 'include' });
      if (!res.ok) return;
      const data = await res.json();
      const byKey = {};
      (data.fields || []).forEach(f => { byKey[f.field_key] = f.assignments || []; });
      (templateData.fields || []).forEach((f, idx) => {
        const el = document.getElementById(`ai-assign-badge-${idx}`);
        if (!el) return;
        const asg = byKey[f.field_key] || [];
        el.textContent = asg.length
          ? `${asg.length} avaliação(ões): ${asg.map(a => a.definition_name).join(', ')}`
          : (f.ai_evaluation_enabled ? 'sem avaliação configurada' : '');
        el.style.color = asg.length ? '#15803d' : 'var(--text-muted)';
      });
    }

    function renderFields() {
      const container = document.getElementById('fields-list');
      container.innerHTML = '';

      if (!templateData || !templateData.fields) return;
      const fields = templateData.fields;

      fields.forEach((f, idx) => {
        const card = document.createElement('div');
        card.className = 'field-card';

        card.innerHTML = `
          <div class="field-header">
            <div>
              <strong>#${idx + 1} ${f.label || '(Sem Rótulo)'}</strong>
              <code style="margin-left: 6px; font-size: 12px;">${f.field_key || ''}</code>
              ${f.is_required ? '<span style="color: var(--danger); font-size: 12px; margin-left: 6px; font-weight: 600;">Obrigatório</span>' : ''}
              ${f.ai_evaluation_enabled ? '<span style="background: #e0e7ff; color: #3730a3; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 6px;">IA Habilitada</span>' : ''}
            </div>
            <div style="display: flex; gap: 4px;">
              <button class="btn btn-outline btn-sm" onclick="moveField(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>Subir</button>
              <button class="btn btn-outline btn-sm" onclick="moveField(${idx}, 1)" ${idx === fields.length - 1 ? 'disabled' : ''}>Descer</button>
              <button class="btn btn-danger btn-sm" onclick="removeField(${idx})">Remover</button>
            </div>
          </div>

          <div class="grid-3">
            <div class="form-group">
              <label>Chave do Campo (field_key):</label>
              <input type="text" value="${f.field_key || ''}" onchange="updateField(${idx}, 'field_key', this.value)">
            </div>
            <div class="form-group">
              <label>Rótulo (label):</label>
              <input type="text" value="${f.label || ''}" onchange="updateField(${idx}, 'label', this.value)">
            </div>
            <div class="form-group">
              <label>Seção do Formulário (section):</label>
              <input type="text" value="${f.section || 'Geral'}" onchange="updateField(${idx}, 'section', this.value)">
            </div>
          </div>

          <div class="grid-3">
            <div class="form-group">
              <label>Tipo (field_type):</label>
              <select onchange="updateField(${idx}, 'field_type', this.value)">
                <option value="text" ${f.field_type === 'text' ? 'selected' : ''}>text</option>
                <option value="textarea" ${f.field_type === 'textarea' ? 'selected' : ''}>textarea</option>
                <option value="select" ${f.field_type === 'select' ? 'selected' : ''}>select</option>
                <option value="integer" ${f.field_type === 'integer' ? 'selected' : ''}>integer</option>
                <option value="float" ${f.field_type === 'float' ? 'selected' : ''}>float</option>
                <option value="boolean" ${f.field_type === 'boolean' ? 'selected' : ''}>boolean</option>
                <option value="date" ${f.field_type === 'date' ? 'selected' : ''}>date</option>
                <option value="file_upload" ${f.field_type === 'file_upload' ? 'selected' : ''}>file_upload</option>
              </select>
            </div>
            <div class="form-group">
              <label>Texto de Ajuda (help_text):</label>
              <input type="text" value="${f.help_text || ''}" onchange="updateField(${idx}, 'help_text', this.value)">
            </div>
            <div class="form-group" style="justify-content: center;">
              <label style="cursor: pointer; margin-top: 14px;">
                <input type="checkbox" ${f.is_required ? 'checked' : ''} onchange="updateField(${idx}, 'is_required', this.checked)" style="width: auto; margin-right: 6px;">
                Campo Obrigatório
              </label>
            </div>
          </div>

          <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 5px; padding: 10px; margin-top: 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;">
            <label style="cursor: pointer; margin-bottom: 0;">
              <input type="checkbox" ${f.ai_evaluation_enabled ? 'checked' : ''} onchange="updateField(${idx}, 'ai_evaluation_enabled', this.checked)" style="width: auto; margin-right: 6px;">
              Disponível para avaliação por IA (<code>ai_evaluation_enabled</code>)
            </label>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span id="ai-assign-badge-${idx}" style="font-size: 11px; color: var(--text-muted);"></span>
              <a class="btn btn-outline btn-sm" href="/demos/forms/ai-config.html?process=${encodeURIComponent(document.getElementById('select-process').value)}&template=${encodeURIComponent(document.getElementById('select-form').value)}&field=${encodeURIComponent(f.field_key || '')}" target="_self">Configurar Avaliação por IA &rarr;</a>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function updateField(index, prop, value) {
      if (templateData && templateData.fields[index]) {
        templateData.fields[index][prop] = value;
      }
    }

    function moveField(index, delta) {
      const newIndex = index + delta;
      if (newIndex < 0 || newIndex >= templateData.fields.length) return;
      const item = templateData.fields.splice(index, 1)[0];
      templateData.fields.splice(newIndex, 0, item);
      renderFields();
    }

    function removeField(index) {
      if (confirm('Deseja remover este campo do template?')) {
        templateData.fields.splice(index, 1);
        renderFields();
      }
    }

    function addNewField() {
      if (!templateData) return;
      const count = templateData.fields.length + 1;
      templateData.fields.push({
        field_key: `campo_${count}`,
        label: `Novo Campo ${count}`,
        section: 'Geral',
        field_type: 'text',
        is_required: false,
        order_index: count,
        help_text: '',
        options: null,
        validation_rules: { section: 'Geral' },
        ai_evaluation_enabled: false,
        ai_context_instructions: null,
        ai_validation_rules: null
      });
      renderFields();
    }

    async function saveTemplate() {
      if (!templateData) return;

      const pKey = document.getElementById('select-process').value;
      const fKey = document.getElementById('select-form').value;
      const name = document.getElementById('form-name').value.trim() || templateData.name;
      const description = document.getElementById('form-desc').value.trim() || templateData.description;

      const payloadFields = templateData.fields.map((f, i) => ({
        field_key: f.field_key.trim(),
        label: f.label.trim(),
        section: f.section ? f.section.trim() : 'Geral',
        field_type: f.field_type,
        is_required: !!f.is_required,
        order_index: i + 1,
        help_text: f.help_text ? f.help_text.trim() : null,
        options: f.options || null,
        validation_rules: f.validation_rules || { section: f.section ? f.section.trim() : 'Geral' },
        ai_evaluation_enabled: !!f.ai_evaluation_enabled,
        ai_context_instructions: f.ai_evaluation_enabled && f.ai_context_instructions ? f.ai_context_instructions.trim() : null,
        ai_validation_rules: f.ai_validation_rules || null
      }));

      // Validação de unicidade e formato de chaves
      const keys = new Set();
      for (const f of payloadFields) {
        if (!f.field_key || !/^[a-z0-9_]+$/.test(f.field_key)) {
          alert(`Chave inválida: '${f.field_key}'. Utilize apenas letras minúsculas, números e sublinhados.`);
          return;
        }
        if (keys.has(f.field_key)) {
          alert(`Chave duplicada: '${f.field_key}'. Cada campo deve ter chave única.`);
          return;
        }
        keys.add(f.field_key);
      }

      const payload = { name, description, fields: payloadFields };
      const url = `/processes/templates/${pKey}/forms/${fKey}`;
      const res = await apiRequest(url, {
        method: 'PUT',
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert('Template atualizado com sucesso no backend.');
        templateData = res.data;
        renderFields();
      } else {
        alert('Erro ao salvar template: ' + (res.data?.detail || JSON.stringify(res.data) || 'Falha na requisição.'));
      }
    }

    (async () => {
      await checkSession();
      await loadTemplate();
    })();
  </script>
</body>

</html>
