<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIVMA - Em Construção</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .box {
      background: #ffffff;
      padding: 48px 32px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      max-width: 520px;
      width: 100%;
    }
    .icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 12px;
    }
    p {
      font-size: 18px;
      color: #475569;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .btn-back {
      display: inline-block;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: #1d4ed8;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-back:hover {
      background: #1e40af;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🚧</div>
    <h1>Em Construção</h1>
    <p>O módulo de formulários dinâmicos e customização de processos está em desenvolvimento.</p>
    <a href="/demos/" class="btn-back">&larr; Voltar ao Hub Central</a>
  </div>
</body>
</html>
