<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIVMA - Observabilidade de Pipelines de IA (Tempo Real)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <a href="../index.html" class="text-slate-400 hover:text-white transition">&larr; Catálogo</a>
      <h1 class="text-xl font-bold text-indigo-400">PIVMA :: Observabilidade de Pipelines de IA</h1>
      <span class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded">Agrupado por Pipeline</span>
    </div>
    <div class="flex items-center space-x-3">
      <div id="connectionStatus" class="flex items-center space-x-2 text-sm text-yellow-400">
        <span class="w-3 h-3 rounded-full bg-yellow-400"></span>
        <span>Desconectado</span>
      </div>
    </div>
  </header>

  <main class="flex-1 p-6 max-w-7xl mx-auto w-full flex flex-col space-y-6">
    <!-- Painel de Controle e Disparo -->
    <div class="bg-slate-800 p-5 rounded-lg border border-slate-700 space-y-4">
      <div class="flex flex-wrap gap-4 items-center justify-between">
        <div class="flex items-center space-x-2 flex-1 min-w-[300px]">
          <label for="adminToken" class="text-sm font-medium text-slate-300">Token Admin:</label>
          <input type="password" id="adminToken" placeholder="Cole o JWT de Administrador..." 
                 class="bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-sm text-white flex-1 focus:outline-none focus:border-indigo-400">
          <button id="btnConnect" class="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold px-4 py-1.5 rounded text-sm transition">
            Conectar Stream
          </button>
        </div>

        <button id="btnClear" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-slate-200 text-sm transition">
          Limpar Visualização
        </button>
      </div>

      <!-- Disparador de Avaliação Interativa -->
      <div class="pt-3 border-t border-slate-700 flex flex-wrap gap-3 items-center">
        <span class="text-xs uppercase font-bold text-slate-400">Simulação:</span>
        <input type="text" id="formInstanceId" placeholder="Form Instance ID (UUID)..." 
               class="bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-sm text-white flex-1 min-w-[280px] focus:outline-none focus:border-indigo-400">
        <button id="btnTriggerEval" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-1.5 rounded text-sm transition flex items-center space-x-1">
          <span>▶ Disparar Avaliação por IA</span>
        </button>
        <span id="triggerFeedback" class="text-xs text-slate-400 ml-2"></span>
      </div>
    </div>

    <!-- Lista de Pipelines Agrupados -->
    <div class="flex-1 flex flex-col space-y-4">
      <div class="flex justify-between items-center text-sm text-slate-400">
        <span>Pipelines Monitorados: <strong id="pipelineCount" class="text-white">0</strong></span>
        <span>Log em Disco: <code class="text-indigo-300">logs/ai/ai_steps.jsonl</code></span>
      </div>

      <div id="pipelinesContainer" class="space-y-6">
        <div id="emptyMessage" class="bg-slate-800 p-8 rounded-lg border border-slate-700 text-center text-slate-400">
          Nenhum pipeline recebido ainda. Conecte ao stream e dispare uma avaliação usando o Form Instance ID fornecido pelo script de seed.
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
