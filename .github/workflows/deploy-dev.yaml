name: CI/CD Pipeline - PI*VMA Back

on:
  push:
    branches: ["develop"]

env:
  DATABASE_URL: postgresql+psycopg://db_user:db_password@db:5432/db

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Instalar Dependências
        run: poetry install --no-interaction --no-root

      - name: Rodar Testes
        run: poetry run pytest

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            # Caminho ajustado para lumina-back
            cd /home/${{ secrets.USERNAME }}/apps/develop/pivma-back

            # Atualiza o código
            git pull origin main --ff-only

            # Constrói a imagem localmente e recria o container usando o compose.yaml atual
            docker compose up -d --build --force-recreate api

            # Limpa imagens que ficaram órfãs (dangling) após o novo build
            docker image prune -f

            # Verifica o status
            docker compose ps