openapi: 3.1.0
info:
  title: Process retirement contract
  version: 2.0.0
paths:
  /processes/{id}:
    delete:
      summary: Permanently removes an unsubmitted draft owned by the caller
      parameters:
        - $ref: '#/components/parameters/ProcessId'
      responses:
        '204':
          description: Draft aggregate and stored attachments were removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /processes/{id}/withdrawal:
    patch:
      summary: Withdraws a revision returned to the effective proponent
      parameters:
        - $ref: '#/components/parameters/ProcessId'
      responses:
        '200':
          description: Process was cancelled by the proponent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRetirementResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /processes/{id}/cancellation:
    patch:
      summary: Cancels a submitted process for a reviewer with triage.review
      parameters:
        - $ref: '#/components/parameters/ProcessId'
      responses:
        '200':
          description: Process was cancelled and pending work was stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRetirementResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /processes/{id}/archive:
    patch:
      summary: Archives a closed or cancelled process for a reviewer
      parameters:
        - $ref: '#/components/parameters/ProcessId'
      responses:
        '200':
          description: Process was moved to the historical archive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRetirementResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /processes:
    get:
      summary: Lists visible processes
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: ARCHIVED is returned only to users with review access.
      responses:
        '200':
          description: Operational processes by default; archived only explicitly.
components:
  parameters:
    ProcessId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ProcessRetirementResponse:
      type: object
      required: [id, status, available_actions]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CANCELLED, ARCHIVED]
        available_actions:
          type: array
          items:
            type: string
            enum: [DELETE_DRAFT, WITHDRAW, CANCEL, ARCHIVE]
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [not_found, forbidden, invalid_transition]
            message:
              type: string
  responses:
    Forbidden:
      description: Actor lacks permission or current scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Process does not exist or is outside the actor visibility scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidTransition:
      description: Operation is incompatible with the persisted process state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
