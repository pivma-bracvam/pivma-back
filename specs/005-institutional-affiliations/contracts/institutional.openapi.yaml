openapi: 3.1.0
info:
  title: pi*VMA Institutional Affiliations API
  version: 1.0.0
  description: Catálogos, vínculos e histórico institucional da feature 005.
security:
  - cookieAuth: []
paths:
  /institutional/institutions:
    get:
      summary: Lista instituições ativas e inativas
      x-required-permission: institutional.read
      responses:
        '200':
          description: Instituições ordenadas por nome e identificador.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstitutionPublic'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Cria uma instituição
      x-required-permission: institutional.catalogs.manage
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionCreate'
      responses:
        '201':
          description: Instituição e mudança institucional persistidas na mesma transação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionPublic'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrInvalidOrigin'
        '409':
          description: Já existe instituição ativa com nome equivalente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /institutional/institutions/{institution_id}:
    parameters:
      - $ref: '#/components/parameters/InstitutionId'
    get:
      summary: Consulta uma instituição
      x-required-permission: institutional.read
      responses:
        '200':
          description: Instituição ativa ou inativa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionPublic'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InstitutionNotFound'
    patch:
      summary: Altera o nome de uma instituição ativa
      x-required-permission: institutional.catalogs.manage
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionUpdate'
      responses:
        '200':
          description: Instituição e mudança institucional atualizadas na mesma transação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionPublic'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrInvalidOrigin'
        '404':
          $ref: '#/components/responses/InstitutionNotFound'
        '409':
          description: Instituição inativa ou nome ativo equivalente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Inativa uma instituição
      x-required-permission: institutional.catalogs.manage
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      responses:
        '204':
          description: Instituição inativada e mudança institucional persistida.
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrInvalidOrigin'
        '404':
          $ref: '#/components/responses/InstitutionNotFound'
        '409':
          description: A instituição já está inativa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /institutional/laboratories:
    get:
      summary: Lista laboratórios ativos e inativos
      x-required-permission: institutional.read
      responses:
        '200':
          description: Laboratórios ordenados por instituição, nome e identificador.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LaboratoryPublic'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Cria um laboratório em uma instituição ativa
      x-required-permission: institutional.catalogs.manage
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaboratoryCreate'
      responses:
        '201':
          description: Laboratório e mudança institucional persistidos na mesma transação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryPublic'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrInvalidOrigin'
        '404':
          $ref: '#/components/responses/InstitutionNotFound'
        '409':
          description: Instituição inativa ou nome de laboratório ativo equivalente na instituição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /institutional/laboratories/{laboratory_id}:
    parameters:
      - $ref: '#/components/parameters/LaboratoryId'
    get:
      summary: Consulta um laboratório
      x-required-permission: institutional.read
      responses:
        '200':
          description: Laboratório ativo ou inativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryPublic'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LaboratoryNotFound'
    patch:
      summary: Altera o nome de um laboratório ativo
      x-required-permission: institutional.catalogs.manage
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaboratoryUpdate'
      responses:
        '200':
          description: Laboratório e mudança institucional atualizados na mesma transação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaboratoryPublic'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrInvalidOrigin'
        '404':
          $ref: '#/components/responses/LaboratoryNotFound'
        '409':
          description: Laboratório inativo ou nome ativo equivalente na instituição.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Inativa um laboratório
      x-required-permission: institutional.catalogs.manage
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      responses:
        '204':
          description: Laboratório inativado e mudança institucional persistida.
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrInvalidOrigin'
        '404':
          $ref: '#/components/responses/LaboratoryNotFound'
        '409':
          description: O laboratório já está inativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /institutional/me/affiliations:
    get:
      summary: Lista os próprios vínculos efetivamente ativos
      x-access: authenticated-self
      responses:
        '200':
          description: União dos vínculos ativos da conta autenticada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SelfAffiliationPublic'
        '401':
          $ref: '#/components/responses/NotAuthenticated'

  /institutional/users/{user_id}/affiliations:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      summary: Lista todos os ciclos de vínculo de uma conta
      x-required-permission: institutional.read
      responses:
        '200':
          description: Vínculos ativos e inativos da conta, em ordem de criação e identificador.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AffiliationPublic'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
    post:
      summary: Cria um vínculo institucional para uma conta ativa
      x-required-permission: institutional.affiliations.manage
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliationCreate'
      responses:
        '201':
          description: Vínculo e mudança institucional persistidos na mesma transação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliationPublic'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrInvalidOrigin'
        '404':
          description: Conta, instituição ou laboratório inexistente para uma pessoa autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Alvo inativo, laboratório fora da instituição ou vínculo ativo equivalente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /institutional/users/{user_id}/affiliations/{affiliation_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/AffiliationId'
    delete:
      summary: Inativa um vínculo institucional da conta
      x-required-permission: institutional.affiliations.manage
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      responses:
        '204':
          description: Vínculo inativado e mudança institucional persistida.
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrInvalidOrigin'
        '404':
          description: Conta ou vínculo correspondente inexistente para uma pessoa autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: O vínculo já está inativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /institutional/changes:
    get:
      summary: Lista mudanças institucionais concluídas
      x-required-permission: institutional.read
      parameters:
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Página em ordem decrescente de ocorrência e identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalChangePage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  parameters:
    TrustedOrigin:
      in: header
      name: Origin
      required: true
      schema:
        type: string
        format: uri
      description: Deve corresponder a uma origem confiável configurada.
    InstitutionId:
      in: path
      name: institution_id
      required: true
      schema:
        type: string
        format: uuid
    LaboratoryId:
      in: path
      name: laboratory_id
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      in: path
      name: user_id
      required: true
      schema:
        type: string
        format: uuid
    AffiliationId:
      in: path
      name: affiliation_id
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotAuthenticated:
      description: Sessão ausente, inválida, vencida ou ligada a conta excluída.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: A conta não possui a permissão exigida. A resposta não confirma se o alvo existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenOrInvalidOrigin:
      description: A origem não é confiável ou a conta não possui a permissão exigida. A resposta não confirma se o alvo existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InstitutionNotFound:
      description: Instituição inexistente para uma pessoa autorizada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LaboratoryNotFound:
      description: Laboratório inexistente para uma pessoa autorizada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UserNotFound:
      description: Conta inexistente para uma pessoa autorizada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Corpo, parâmetro ou paginação inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    InstitutionCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    InstitutionUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    InstitutionSummary:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean

    InstitutionPublic:
      allOf:
        - $ref: '#/components/schemas/InstitutionSummary'
        - $ref: '#/components/schemas/AuditFields'

    LaboratoryCreate:
      type: object
      additionalProperties: false
      required: [institution_id, name]
      properties:
        institution_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255

    LaboratoryUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    LaboratorySummary:
      type: object
      required: [id, institution_id, name, active]
      properties:
        id:
          type: string
          format: uuid
        institution_id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean

    LaboratoryPublic:
      allOf:
        - $ref: '#/components/schemas/LaboratorySummary'
        - $ref: '#/components/schemas/AuditFields'

    AffiliationCreate:
      type: object
      additionalProperties: false
      required: [institution_id]
      properties:
        institution_id:
          type: string
          format: uuid
        laboratory_id:
          type:
            - string
            - 'null'
          format: uuid
          default: null

    AffiliationPublic:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - institution
        - laboratory
        - active
        - created_by
        - created_at
        - updated_by
        - updated_at
        - deleted_by
        - deleted_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        institution:
          $ref: '#/components/schemas/InstitutionSummary'
        laboratory:
          oneOf:
            - $ref: '#/components/schemas/LaboratorySummary'
            - type: 'null'
        active:
          type: boolean
          description: Estado efetivo do vínculo e de todos os seus alvos.
        created_by:
          $ref: '#/components/schemas/NullableUuid'
        created_at:
          type: string
          format: date-time
        updated_by:
          $ref: '#/components/schemas/NullableUuid'
        updated_at:
          $ref: '#/components/schemas/NullableDateTime'
        deleted_by:
          $ref: '#/components/schemas/NullableUuid'
        deleted_at:
          $ref: '#/components/schemas/NullableDateTime'

    SelfAffiliationPublic:
      type: object
      additionalProperties: false
      required: [id, institution, laboratory, active]
      properties:
        id:
          type: string
          format: uuid
        institution:
          $ref: '#/components/schemas/InstitutionSummary'
        laboratory:
          oneOf:
            - $ref: '#/components/schemas/LaboratorySummary'
            - type: 'null'
        active:
          type: boolean
          const: true
          description: A autoconsulta omite vínculos que não estejam efetivamente ativos.

    InstitutionalChangePublic:
      type: object
      additionalProperties: false
      required: [id, action, target_type, target_id, actor_user_id, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          maxLength: 64
        target_type:
          type: string
          enum: [institution, laboratory, affiliation]
        target_id:
          type: string
          format: uuid
        actor_user_id:
          $ref: '#/components/schemas/NullableUuid'
        occurred_at:
          type: string
          format: date-time

    InstitutionalChangePage:
      type: object
      additionalProperties: false
      required: [offset, limit, items]
      properties:
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        items:
          type: array
          items:
            $ref: '#/components/schemas/InstitutionalChangePublic'

    AuditFields:
      type: object
      required:
        - created_by
        - created_at
        - updated_by
        - updated_at
        - deleted_by
        - deleted_at
      properties:
        created_by:
          $ref: '#/components/schemas/NullableUuid'
        created_at:
          type: string
          format: date-time
        updated_by:
          $ref: '#/components/schemas/NullableUuid'
        updated_at:
          $ref: '#/components/schemas/NullableDateTime'
        deleted_by:
          $ref: '#/components/schemas/NullableUuid'
        deleted_at:
          $ref: '#/components/schemas/NullableDateTime'

    NullableUuid:
      type:
        - string
        - 'null'
      format: uuid

    NullableDateTime:
      type:
        - string
        - 'null'
      format: date-time

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
