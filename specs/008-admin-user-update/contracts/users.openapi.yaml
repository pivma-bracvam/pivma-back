openapi: 3.1.0
info:
  title: pi*VMA Administrative User Update API
  version: 1.0.0
  description: Atualização administrativa dos dados editáveis de uma conta.
security:
  - cookieAuth: []
paths:
  /users/{user_id}:
    patch:
      summary: Atualiza os dados editáveis de uma conta
      operationId: updateUser
      x-required-permission: users.manage
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Conta atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Username ou e-mail já pertence a uma conta ativa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  responses:
    NotAuthenticated:
      description: Sessão ausente, inválida, vencida ou ligada a conta inativa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: A conta não possui users.manage ou a origem não é confiável.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: O UUID não identifica uma conta existente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: O corpo não atende ao contrato de atualização.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            required: [detail]
            properties:
              detail:
                type: array
                items:
                  type: object

  schemas:
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]+$'
          title: Username
        email:
          type: string
          format: email
          title: Email
        full_name:
          type: string
          minLength: 1
          maxLength: 255
          title: Full Name
        password:
          type: string
          minLength: 8
          maxLength: 128
          title: Password
    UserPublic:
      type: object
      additionalProperties: false
      required: [id, username, email, full_name]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        full_name:
          anyOf:
            - type: string
            - type: 'null'
          title: Full Name
    Error:
      type: object
      required: [detail]
      properties:
        detail: {}
