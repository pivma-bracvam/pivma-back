openapi: 3.1.0
info:
  title: pi*VMA Password Reset API
  version: 1.0.0
  description: Recuperação e redefinição de senha por token temporário (Spec 039).
paths:
  /auth/forgot-password:
    post:
      summary: Pede o envio do link de redefinição de senha
      operationId: forgotPassword
      tags: [auth]
      security: []
      description: >-
        Pública. Responde sempre a mesma mensagem para entrada válida, exista
        ou não uma conta ativa com o e-mail. Com conta ativa e canal de e-mail
        configurado, emite um token válido por 30 minutos, invalida os tokens
        anteriores da conta e registra o envio do link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example: { email: maria@exemplo.org }
      responses:
        '200':
          description: Mensagem neutra.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
              example:
                message: Se o e-mail estiver cadastrado, as instruções foram enviadas.
        '422':
          description: E-mail ausente, com formato inválido ou campos fora do contrato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: { code: validation_error, message: Dados inválidos. }
  /auth/reset-password:
    post:
      summary: Redefine a senha com o token recebido por e-mail
      operationId: resetPassword
      tags: [auth]
      security: []
      description: >-
        Pública. Aceita o token só se ele foi emitido, não expirou, não foi
        usado, não foi substituído e pertence a uma conta ativa. A redefinição
        não abre sessão nem encerra sessões existentes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example: { token: 'q3J...43 caracteres', new_password: NovaSenha456 }
      responses:
        '204':
          description: Senha trocada e token marcado como usado.
        '400':
          description: >-
            Token inválido, expirado, usado, substituído ou de conta inativa.
            Mesmo código e mensagem em todos os casos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail:
                  code: invalid_reset_token
                  message: Link de redefinição inválido ou expirado.
        '422':
          description: >-
            Campo ausente, fora do contrato ou senha fora da política. O erro de
            senha não expõe a regra nem o valor. O token continua utilizável.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ForgotPasswordResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          description: Sem caracteres de espaço.
    ErrorResponse:
      description: Formato único de erro (Spec 034).
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
