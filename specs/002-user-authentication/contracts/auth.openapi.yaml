openapi: 3.1.0
info:
  title: pi*VMA Authentication API
  version: 1.0.0
paths:
  /auth/login:
    post:
      summary: Autentica uma conta ativa por username ou e-mail e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCredentials'
      responses:
        '200':
          description: Sessão criada; Set-Cookie entrega access_token.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: access_token HttpOnly, Secure, SameSite=Strict, Path=/ e expiração de até 8 horas.
        '401':
          description: Credenciais inválidas, conta inexistente ou conta excluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me:
    get:
      summary: Retorna a identidade e o acesso efetivo da sessão atual
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Identidade da conta autenticada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Sessão ausente, inválida, vencida ou vinculada a conta excluída.
  /auth/logout:
    post:
      summary: Remove o cookie de autenticação do navegador
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
          description: Deve corresponder exatamente a uma origem confiável configurada.
      responses:
        '204':
          description: Cookie removido. O token não sofre revogação no servidor.
        '401':
          description: Sessão ausente, inválida, vencida ou vinculada a conta excluída.
        '403':
          description: Origem ausente, inválida ou não confiável.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
  schemas:
    LoginCredentials:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Username ou e-mail, sem distinção de caixa.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    UserIdentity:
      type: object
      additionalProperties: false
      required: [id, username, email]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
    AccessScope:
      type: object
      additionalProperties: false
      required: [process_id, institution_id, laboratory_id, roles]
      properties:
        process_id:
          type: string
          format: uuid
        institution_id:
          type: [string, 'null']
          format: uuid
        laboratory_id:
          type: [string, 'null']
          format: uuid
        roles:
          type: array
          items:
            type: string
    CurrentUserAccess:
      type: object
      additionalProperties: false
      required: [profiles, global_permissions, scopes]
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSummary'
        global_permissions:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/AccessScope'
    ProfileSummary:
      type: object
      additionalProperties: false
      required: [id, name, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean
    CurrentUserResponse:
      allOf:
        - $ref: '#/components/schemas/UserIdentity'
        - type: object
          required: [user, access]
          properties:
            user:
              $ref: '#/components/schemas/UserIdentity'
            access:
              $ref: '#/components/schemas/CurrentUserAccess'
    Error:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string
