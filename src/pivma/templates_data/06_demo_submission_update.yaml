process_template:
  key: "demo_submission_update"
  name: "[DEMO] Atualização de Submissão"
  description: "Template exclusivo da demonstração da Spec 021 (PUT/PATCH de submissão), com campos de tipos variados. Não disponível para criação manual de processos."
  version: 1
  is_active: false

phases:
  - key: "phase_1_submission"
    name: "Fase 1: Submissão"
    order_index: 1
    activities:
      - key: "proposal_submission"
        name: "Submissão da Proposta"
        order_index: 1
        assigned_role: "proponent"
        sla_hours: 168
        form_template_key: "submission_demo_update_v1"
        dependencies: []

forms:
  - key: "submission_demo_update_v1"
    name: "Formulário de Submissão - Demo Atualização"
    version: 1
    description: "Campos de tipos variados usados apenas pela demonstração da Spec 021."
    fields:
      - field_key: "demo_summary"
        label: "Resumo da demonstração"
        field_type: "textarea"
        is_required: true
        order_index: 1
        help_text: "Descrição livre usada para exercitar PUT/PATCH."
      - field_key: "demo_category"
        label: "Categoria"
        field_type: "select"
        is_required: false
        order_index: 2
        options:
          - value: "a"
            label: "Categoria A"
          - value: "b"
            label: "Categoria B"
      - field_key: "demo_count"
        label: "Quantidade de amostras"
        field_type: "integer"
        is_required: false
        order_index: 3
        validation_rules:
          min: 1
          max: 100
      - field_key: "demo_ratio"
        label: "Razão de validação"
        field_type: "float"
        is_required: false
        order_index: 4
        validation_rules:
          min: 0.1
          max: 10.0
      - field_key: "demo_target_date"
        label: "Data alvo"
        field_type: "date"
        is_required: false
        order_index: 5
      - field_key: "demo_active"
        label: "Ativo para revisão"
        field_type: "boolean"
        is_required: false
        order_index: 6
