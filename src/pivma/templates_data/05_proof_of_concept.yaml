process_template:
  key: "proof_of_concept"
  name: "Prova de Conceito (PoC)"
  description: "Ideia de método ainda a ser desenvolvido ou em estágio inicial de desenvolvimento e otimização (Método Conceitual / Early-Stage Pipeline)."
  version: 1
  is_active: true

phases:
  - key: "phase_1_submission_triage"
    name: "Fase 1: Submissão e Triagem"
    order_index: 1
    activities:
      - key: "proposal_submission"
        name: "Submissão da Proposta"
        order_index: 1
        assigned_role: "PROPONENT"
        form_template_key: "submission_proof_of_concept_v1"
        dependencies: []

      - key: "triage_evaluation"
        name: "Triagem e Decisão BraCVAM"
        order_index: 2
        assigned_role: "TRIAGE_LEAD"
        form_template_key: "triage_review_v1"
        dependencies:
          - required_activity_key: "proposal_submission"
            required_status: "COMPLETED"
            condition_type: "ACTIVITY_COMPLETED"

forms:
  - key: "submission_proof_of_concept_v1"
    name: "Formulário de Submissão - Prova de Conceito (PoC)"
    version: 1
    description: "Submissão de ideia conceitual ou método em estágio preliminar de P&D para orientação estratégica do BraCVAM."
    fields:
      - field_key: "method_title"
        label: "Título da Prova de Conceito"
        field_type: "text"
        is_required: true
        order_index: 1

      - field_key: "targeted_endpoint"
        label: "Desfecho / Toxicidade Alvo"
        field_type: "select"
        is_required: true
        order_index: 2
        options:
          - value: "ocular_irritation"
            label: "Irritação / Corrosão Ocular"
          - value: "skin_sensitization"
            label: "Sensibilização Cutânea"
          - value: "phototoxicity"
            label: "Fototoxicidade"
          - value: "acute_toxicity"
            label: "Toxicidade Aguda"
          - value: "systemic_toxicity"
            label: "Toxicidade Sistêmica"

      - field_key: "biological_rationale_and_3rs"
        label: "Hipótese Biológica e Potencial de Substituição 3R"
        field_type: "textarea"
        is_required: true
        order_index: 3
        ai_evaluation_enabled: true
        ai_context_instructions: "Avaliar o mérito inovador, plausibilidade biológica do conceito e impacto potencial na redução/substituição de animais."
        ai_validation_rules:
          min_length: 50

      - field_key: "development_roadmap"
        label: "Plano de Desenvolvimento e Etapas de Otimização Previstas"
        field_type: "textarea"
        is_required: true
        order_index: 4
        ai_evaluation_enabled: true
        ai_context_instructions: "Verificar a viabilidade metodológica do cronograma e marcos de desenvolvimento propostos."
        ai_validation_rules:
          min_length: 50

      - field_key: "estimated_timeline_months"
        label: "Estimativa de Duração da Prova de Conceito (Meses)"
        field_type: "integer"
        is_required: false
        order_index: 5
        validation_rules:
          min: 1
          max: 60

      - field_key: "concept_note_file"
        label: "Nota Conceitual ou Documento de Projeto Preliminar (PDF)"
        field_type: "file_upload"
        is_required: false
        order_index: 6
        validation_rules:
          allowed_extensions: ["pdf"]
          max_size_mb: 25

  - key: "triage_review_v1"
    name: "Formulário de Parecer de Triagem"
    version: 1
    description: "Avaliação técnica preliminar dos requisitos de elegibilidade da proposta."
    fields:
      - field_key: "regulatory_adherence_score"
        label: "Nível de Aderência Regulatória"
        field_type: "select"
        is_required: true
        order_index: 1
        options:
          - value: "high"
            label: "Alto - Atende a todas as diretrizes da OCDE"
          - value: "medium"
            label: "Médio - Pendências documentais sanáveis"
          - value: "low"
            label: "Baixo - Não atende critérios mínimos"

      - field_key: "triage_summary_notes"
        label: "Notas de Síntese da Triagem"
        field_type: "textarea"
        is_required: true
        order_index: 2
