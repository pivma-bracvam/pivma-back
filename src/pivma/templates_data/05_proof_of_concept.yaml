process_template:
  key: "proof_of_concept"
  name: "Prova de Conceito (PoC)"
  description: "Ideia de método ainda a ser desenvolvido ou em estágio inicial de desenvolvimento e otimização (Método Conceitual / Early-Stage Pipeline)."
  version: 2
  is_active: true

phases:
  - key: "phase_1_submission_triage"
    name: "Fase 1: Submissão e Triagem"
    order_index: 1
    activities:
      - key: "proposal_submission"
        name: "Submissão da Proposta"
        order_index: 1
        assigned_role: "proponent"
        sla_hours: 168  # 7 dias corridos para preencher e submeter (Spec 018)
        form_template_key: "submission_proof_of_concept_v1"
        dependencies: []

      - key: "triage_evaluation"
        name: "Triagem e Decisão BraCVAM"
        order_index: 2
        assigned_role: "bracvam"
        sla_hours: 72  # 3 dias corridos para a triagem decidir (Spec 018)
        form_template_key: "triage_review_v1"
        dependencies:
          - required_activity_key: "proposal_submission"
            required_status: "COMPLETED"
            condition_type: "ACTIVITY_COMPLETED"

forms:
  - key: "submission_proof_of_concept_v1"
    name: "Formulário Preliminar (FP) - BraCVAM"
    version: 1
    description: "Formulário Preliminar do BraCVAM para avaliação preliminar do estado de desenvolvimento/validação de um método de teste."
    fields:
      # ─── Seção 1. Informações Gerais ───
      - field_key: "proponent_organization"
        label: "Organização/Empresa (proponente)"
        field_type: "text"
        is_required: true
        order_index: 1
        validation_rules:
          section: "1. Informações Gerais"
      - field_key: "proponent_unit"
        label: "Departamento/Faculdade/Instituto/Outro"
        field_type: "text"
        is_required: false
        order_index: 2
        validation_rules:
          section: "1. Informações Gerais"
      - field_key: "proponent_address"
        label: "Endereço"
        field_type: "text"
        is_required: false
        order_index: 3
        validation_rules:
          section: "1. Informações Gerais"
      - field_key: "proponent_postal_code"
        label: "CEP"
        field_type: "text"
        is_required: false
        order_index: 4
        validation_rules:
          section: "1. Informações Gerais"
      - field_key: "proponent_city"
        label: "Cidade"
        field_type: "text"
        is_required: false
        order_index: 5
        validation_rules:
          section: "1. Informações Gerais"
      - field_key: "proponent_country"
        label: "País"
        field_type: "text"
        is_required: false
        order_index: 6
        validation_rules:
          section: "1. Informações Gerais"
      - field_key: "contact_title"
        label: "Titulação do contato responsável"
        field_type: "select"
        is_required: false
        order_index: 7
        options:
          - value: "mr"
            label: "Mr."
          - value: "ms"
            label: "Ms."
          - value: "dr"
            label: "Dr."
          - value: "prof"
            label: "Prof."
        validation_rules:
          section: "1. Informações Gerais"
      - field_key: "contact_first_name"
        label: "Primeiro nome"
        field_type: "text"
        is_required: true
        order_index: 8
        validation_rules:
          section: "1. Informações Gerais"
      - field_key: "contact_last_name"
        label: "Último nome"
        field_type: "text"
        is_required: true
        order_index: 9
        validation_rules:
          section: "1. Informações Gerais"
      - field_key: "contact_role"
