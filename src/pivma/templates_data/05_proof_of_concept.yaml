        validation_rules:
          section: "1. Informações Gerais"
      - field_key: "contact_email"
        label: "E-mail"
        field_type: "text"
        is_required: true
        order_index: 13
        help_text: "Formato de e-mail não é validado pelo sistema."
        validation_rules:
          section: "1. Informações Gerais"
      - field_key: "additional_contact_title"
        label: "Titulação (contato adicional)"
        field_type: "select"
        is_required: false
        order_index: 14
        options:
          - value: "mr"
            label: "Mr."
          - value: "ms"
            label: "Ms."
          - value: "dr"
            label: "Dr."
          - value: "prof"
