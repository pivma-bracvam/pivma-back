process_template:
  key: "validated_method_dossier"
  name: "Método Validado – Dossiê Submetido"
  description: "Método 100% novo já desenvolvido, protocolo estabelecido e toda validação já concluída – dossiê pronto para revisão por pares e adoção regulatória (Peer-Review Ready)."
  version: 4
  is_active: true

phases:
  - key: "phase_1_submission_triage"
    name: "Fase 1: Submissão e Triagem"
    order_index: 1
    activities:
      - key: "proposal_submission"
        name: "Submissão da Proposta"
        order_index: 1
        assigned_role: "proponent"
        access:
          edit: ["proponent"]
          view: []
        activity_type: "form"
        sla_hours: 168  # 7 dias corridos para preencher e submeter (Spec 018)
        form_template_key: "submission_validated_dossier_v1"
        dependencies: []

      - key: "triage_evaluation"
        name: "Triagem e Decisão BraCVAM"
        order_index: 2
        assigned_role: "bracvam"
        access:
          edit: ["bracvam"]
          view: []
        sla_hours: 72  # 3 dias corridos para a triagem decidir (Spec 018)
        dependencies:
          - required_activity_key: "proposal_submission"
            required_status: "COMPLETED"
            condition_type: "ACTIVITY_COMPLETED"

      - key: "submission_return_review"
        name: "Revisão do Retorno"
        order_index: 3
        assigned_role: "proponent"
        access:
          edit: ["proponent"]
          view: []
        activity_type: "return_review"
        sla_hours: 168  # 7 dias corridos para o proponente decidir (Spec 030)
        dependencies: []  # aberta por evento (retorno da IA ou da triagem)

  # Fase 2 (Spec 028): as 8 atividades de atribuição de cargo da Etapa 2,
  # substituindo a prévia placeholder da Spec 017 nesta nova versão (v4) —
  # instâncias presas à v3 continuam vendo "planning_preview" intacta
  # (Spec 004 FR-001/SC-002). Ordem e dependências decididas com o usuário
  # (ver "Sequência de Preenchimento" em specs/028-role-assignment-invites/
  # spec.md): 1-2 (Proponente) sem dependência entre si; 3-8 dependem só da
  # conclusão de group_manager (2), não umas das outras.
  - key: "phase_2_role_assignment"
    name: "Fase 2: Composição da Governança"
    order_index: 2
    activities:
      - key: "assign_sponsor"
        name: "Definir o Patrocinador"
        order_index: 1
        assigned_role: "proponent"
        access:
          edit: ["proponent"]
          view: []
        activity_type: "role_assignment"
        target_role_key: "sponsor"
        dependencies:
          - required_activity_key: "triage_evaluation"
            required_status: "COMPLETED"
            condition_type: "ACTIVITY_COMPLETED"

      - key: "assign_group_manager"
        name: "Definir os integrantes do Grupo Gestor"
        order_index: 2
        assigned_role: "proponent"
        access:
          edit: ["proponent"]
          view: []
        activity_type: "role_assignment"
        target_role_key: "group_manager"
        dependencies:
          - required_activity_key: "triage_evaluation"
            required_status: "COMPLETED"
            condition_type: "ACTIVITY_COMPLETED"

      - key: "assign_sample_selection_group"
        name: "Definir o Grupo de Seleção de Amostras"
        order_index: 3
        assigned_role: "group_manager"
        access:
          edit: ["group_manager"]
          view: []
        activity_type: "role_assignment"
        target_role_key: "sample_selection_group"
        dependencies:
          - required_activity_key: "assign_group_manager"
            required_status: "COMPLETED"
            condition_type: "ACTIVITY_COMPLETED"

      - key: "assign_lead_laboratory"
        name: "Definir o Laboratório Líder"
        order_index: 4
        assigned_role: "group_manager"
        access:
          edit: ["group_manager"]
          view: []
        activity_type: "role_assignment"
        target_role_key: "lead_laboratory"
        dependencies:
          - required_activity_key: "assign_group_manager"
            required_status: "COMPLETED"
            condition_type: "ACTIVITY_COMPLETED"

      - key: "assign_participating_laboratory"
        name: "Definir os Laboratórios Participantes"
        order_index: 5
        assigned_role: "group_manager"
        access:
          edit: ["group_manager"]
          view: []
        activity_type: "role_assignment"
        target_role_key: "participating_laboratory"
        dependencies:
          - required_activity_key: "assign_group_manager"
            required_status: "COMPLETED"
            condition_type: "ACTIVITY_COMPLETED"

      - key: "assign_statistician"
        name: "Definir o Estatístico"
        order_index: 6
        assigned_role: "group_manager"
        access:
          edit: ["group_manager"]
          view: []
        activity_type: "role_assignment"
        target_role_key: "statistician"
        dependencies:
          - required_activity_key: "assign_group_manager"
            required_status: "COMPLETED"
            condition_type: "ACTIVITY_COMPLETED"

      - key: "assign_collaborator"
        name: "Definir Colaboradores e Observadores"
        order_index: 7
        assigned_role: "bracvam"
        access:
          edit: ["bracvam"]
          view: []
        activity_type: "role_assignment"
        target_role_key: "collaborator"
        dependencies:
          - required_activity_key: "assign_group_manager"
            required_status: "COMPLETED"
            condition_type: "ACTIVITY_COMPLETED"

      - key: "assign_adhoc_evaluator"
        name: "Definir Especialistas Temáticos (Comitê ADHOC)"
        order_index: 8
        assigned_role: "bracvam"
        access:
          edit: ["bracvam"]
          view: []
        activity_type: "role_assignment"
        target_role_key: "adhoc_evaluator"
        dependencies:
          - required_activity_key: "assign_group_manager"
            required_status: "COMPLETED"
            condition_type: "ACTIVITY_COMPLETED"

forms:
  - key: "submission_validated_dossier_v1"
    name: "Formulário de Submissão - Método Validado (Dossiê Pronto)"
    version: 1
    description: "Exemplo enxuto do uso da avaliação por IA: descreva o conceito-chave do método e a IA verifica se a terminologia está atualizada."
    fields:
      - field_key: "method_title"
        label: "Título do método validado"
        field_type: "text"
        is_required: true
        order_index: 1
        help_text: "Nome do método com validação concluída."

      - field_key: "terminology_notes"
        label: "Conceito-chave do método e terminologia usada"
        field_type: "textarea"
        is_required: true
        order_index: 2
        help_text: "Descreva o conceito central em 1–2 parágrafos."
        ai_evaluation_enabled: true
        ai_context_instructions: "Verificar se os termos usados para descrever o conceito estão alinhados à nomenclatura científica e regulatória atual (OCDE, IATA, NAM). Apontar termos desatualizados e sugerir equivalentes modernos."
        ai_validation_rules:
          min_length: 30

