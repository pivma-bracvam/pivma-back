process_template:
  key: "validated_method_dossier"
  name: "Método Validado – Dossiê Submetido"
  description: "Método 100% novo já desenvolvido, protocolo estabelecido e toda validação já concluída – dossiê pronto para revisão por pares e adoção regulatória (Peer-Review Ready)."
  version: 1
  is_active: true

phases:
  - key: "phase_1_submission_triage"
    name: "Fase 1: Submissão e Triagem"
    order_index: 1
    activities:
      - key: "proposal_submission"
        name: "Submissão da Proposta"
        order_index: 1
        assigned_role: "PROPONENT"
        form_template_key: "submission_validated_dossier_v1"
        dependencies: []

      - key: "triage_evaluation"
        name: "Triagem e Decisão BraCVAM"
        order_index: 2
        assigned_role: "TRIAGE_LEAD"
        form_template_key: "triage_review_v1"
        dependencies:
          - required_activity_key: "proposal_submission"
            required_status: "COMPLETED"
            condition_type: "ACTIVITY_COMPLETED"

forms:
  - key: "submission_validated_dossier_v1"
    name: "Formulário de Submissão - Método Validado (Dossiê Pronto)"
    version: 1
    description: "Submissão de estudo com validação interlaboratorial completa concluída para avaliação regulatória e revisão por pares."
    fields:
      - field_key: "method_title"
        label: "Título do Método Validado"
        field_type: "text"
        is_required: true
        order_index: 1

      - field_key: "validated_endpoint"
        label: "Desfecho Validado"
        field_type: "select"
        is_required: true
        order_index: 2
        options:
          - value: "ocular_irritation"
            label: "Irritação / Corrosão Ocular"
          - value: "skin_sensitization"
            label: "Sensibilização Cutânea"
          - value: "phototoxicity"
            label: "Fototoxicidade"
          - value: "acute_toxicity"
            label: "Toxicidade Aguda"
          - value: "endocrine_disruption"
            label: "Desregulação Endócrina"

      - field_key: "executive_validation_summary"
        label: "Resumo Executivo do Estudo de Validação e Estatística Interlaboratorial"
        field_type: "textarea"
        is_required: true
        order_index: 3
        ai_evaluation_enabled: true
        ai_context_instructions: "Analisar se o resumo consolida acurácia, reprodutibilidade intra e interlaboratorial, limites de detecção e concordância com o padrão de referência."
        ai_validation_rules:
          min_length: 50

      - field_key: "international_guidelines_adherence"
        label: "Demonstração de Aderência às Diretrizes da OCDE (GD 34 e correlatas)"
        field_type: "textarea"
        is_required: true
        order_index: 4
        ai_evaluation_enabled: true
        ai_context_instructions: "Verificar a conformidade do estudo com os critérios de validação e aceitação regulatória internacional da OCDE."
        ai_validation_rules:
          min_length: 50

      - field_key: "complete_dossier_file"
        label: "Dossiê Completo de Validação Consolidado (PDF)"
        field_type: "file_upload"
        is_required: true
        order_index: 5
        validation_rules:
          allowed_extensions: ["pdf"]
          max_size_mb: 50

      - field_key: "peer_reviewed_publications"
        label: "Publicações Científicas e Referências de Suporte"
        field_type: "textarea"
        is_required: false
        order_index: 6

  - key: "triage_review_v1"
    name: "Formulário de Parecer de Triagem"
    version: 1
    description: "Avaliação técnica preliminar dos requisitos de elegibilidade da proposta."
    fields:
      - field_key: "regulatory_adherence_score"
        label: "Nível de Aderência Regulatória"
        field_type: "select"
        is_required: true
        order_index: 1
        options:
          - value: "high"
            label: "Alto - Atende a todas as diretrizes da OCDE"
          - value: "medium"
            label: "Médio - Pendências documentais sanáveis"
          - value: "low"
            label: "Baixo - Não atende critérios mínimos"

      - field_key: "triage_summary_notes"
        label: "Notas de Síntese da Triagem"
        field_type: "textarea"
        is_required: true
        order_index: 2
