process_template:
  key: "validated_method_dossier"
  name: "Método Validado – Dossiê Submetido"
  description: "Método 100% novo já desenvolvido, protocolo estabelecido e toda validação já concluída – dossiê pronto para revisão por pares e adoção regulatória (Peer-Review Ready)."
  version: 1
  is_active: true

phases:
  - key: "phase_1_submission_triage"
    name: "Fase 1: Submissão e Triagem"
    order_index: 1
    activities:
      - key: "proposal_submission"
        name: "Submissão da Proposta"
        order_index: 1
        assigned_role: "PROPONENT"
        form_template_key: "submission_validated_dossier_v1"
        dependencies: []

      - key: "triage_evaluation"
        name: "Triagem e Decisão BraCVAM"
        order_index: 2
        assigned_role: "TRIAGE_LEAD"
        form_template_key: "triage_review_v1"
        dependencies:
          - required_activity_key: "proposal_submission"
            required_status: "COMPLETED"
            condition_type: "ACTIVITY_COMPLETED"

forms:
  - key: "submission_validated_dossier_v1"
    name: "Formulário de Submissão - Método Validado (Dossiê Pronto)"
    version: 1
    description: "Exemplo enxuto do uso da avaliação por IA: descreva o conceito-chave do método e a IA verifica se a terminologia está atualizada."
    fields:
      - field_key: "method_title"
        label: "Título do método validado"
        field_type: "text"
        is_required: true
        order_index: 1
        help_text: "Nome do método com validação concluída."

      - field_key: "terminology_notes"
        label: "Conceito-chave do método e terminologia usada"
        field_type: "textarea"
        is_required: true
        order_index: 2
        help_text: "Descreva o conceito central em 1–2 parágrafos."
        ai_evaluation_enabled: true
        ai_context_instructions: "Verificar se os termos usados para descrever o conceito estão alinhados à nomenclatura científica e regulatória atual (OCDE, IATA, NAM). Apontar termos desatualizados e sugerir equivalentes modernos."
        ai_validation_rules:
          min_length: 30

  - key: "triage_review_v1"
    name: "Formulário de Parecer de Triagem"
    version: 1
    description: "Avaliação técnica preliminar dos requisitos de elegibilidade da proposta."
    fields:
      - field_key: "regulatory_adherence_score"
        label: "Nível de Aderência Regulatória"
        field_type: "select"
        is_required: true
        order_index: 1
        options:
          - value: "high"
            label: "Alto - Atende a todas as diretrizes da OCDE"
          - value: "medium"
            label: "Médio - Pendências documentais sanáveis"
          - value: "low"
            label: "Baixo - Não atende critérios mínimos"

      - field_key: "triage_summary_notes"
        label: "Notas de Síntese da Triagem"
        field_type: "textarea"
        is_required: true
        order_index: 2
