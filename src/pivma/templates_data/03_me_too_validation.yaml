process_template:
  key: "me_too_validation"
  name: "Validação Me-Too"
  description: "Método já validado sendo proposto um novo sistema teste ou método mecanisticamente e funcionalmente semelhante (Transferência / Adaptação de Sistema-Teste)."
  version: 2
  is_active: true

phases:
  - key: "phase_1_submission_triage"
    name: "Fase 1: Submissão e Triagem"
    order_index: 1
    activities:
      - key: "proposal_submission"
        name: "Submissão da Proposta"
        order_index: 1
        assigned_role: "proponent"
        access:
          edit: ["proponent"]
          view: []
        sla_hours: 168  # 7 dias corridos para preencher e submeter (Spec 018)
        form_template_key: "submission_me_too_v1"
        dependencies: []

      - key: "triage_evaluation"
        name: "Triagem e Decisão BraCVAM"
        order_index: 2
        assigned_role: "bracvam"
        access:
          edit: ["bracvam"]
          view: []
        sla_hours: 72  # 3 dias corridos para a triagem decidir (Spec 018)
        dependencies:
          - required_activity_key: "proposal_submission"
            required_status: "COMPLETED"
            condition_type: "ACTIVITY_COMPLETED"

forms:
  - key: "submission_me_too_v1"
    name: "Formulário de Submissão - Validação Me-Too"
    version: 1
    description: "Avaliação de método mecanisticamente e funcionalmente semelhante a método já validado."
    fields:
      - field_key: "method_title"
        label: "Título do método"
        field_type: "text"
        is_required: true
        order_index: 1
        help_text: "Nome do método alternativo proposto."

