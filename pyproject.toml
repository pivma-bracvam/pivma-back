[project]
name = "pivma"
version = "0.1.0"
description = ""
authors = [
    {name = "meirelesgc",email = "geu_costa@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "argon2-cffi (>=25.1,<26)",
    "PyJWT (>=2.13,<3.0)"
]

[tool.poetry]
packages = [{include = "pivma", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.2,<0.17.0)",
    "typos (>=1.49.0,<2.0.0)",
    "httpx2 (>=2.10.0,<3.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "testcontainers (>=4.15.0,<5.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['.', 'src']
addopts = ['-p', 'no:warnings', '--cov=src/pivma', '--cov-context=test']

[tool.poe] 
poetry_command = ""

[tool.poe.tasks]
lint = { cmd = "ruff check" }
format.sequence = [
  { cmd = "ruff check" },
  { cmd = "ruff check --fix" },
  { cmd = "ruff format" },
]
serve = "fastapi dev src/pivma/__init__.py"
test.sequence = [
  { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS", ignore_fail = true },
  { cmd = "coverage html --show-contexts" }
]
